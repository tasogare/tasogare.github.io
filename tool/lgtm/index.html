      document.documentElement.classList.toggle(

        localStorage.theme === "dark" ||

    </script><meta name="viewport" content="width=device-width, initial-scale=1"><title>LGTM ジェネレータ | tasogare&#39;s website</title><meta name="description" content="画像を選んで LGTM を差し込む Rust/WASM 製ツール。処理はすべてブラウザ内で完結し、画像はサーバーに送信されません。"><meta name="twitter:card" content="summary"><meta name="twitter:title" content="LGTM ジェネレータ | tasogare's website"><meta name="twitter:description" content="画像を選んで LGTM を差し込む Rust/WASM 製ツール。処理はすべてブラウザ内で完結し、画像はサーバーに送信されません。"><meta name="twitter:url" content="https://tasogare.github.io/tool/lgtm/"><meta property="og:title" content="LGTM ジェネレータ | tasogare's website"><meta property="og:description" content="画像を選んで LGTM を差し込む Rust/WASM 製ツール。処理はすべてブラウザ内で完結し、画像はサーバーに送信されません。"><meta property="og:url" content="https://tasogare.github.io/tool/lgtm/"><meta property="og:type" content="website"><link rel="canonical" href="https://tasogare.github.io/tool/lgtm/"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="sitemap" href="/sitemap-index.xml"><link rel="alternate" type="application/rss+xml" title="tasogare's website" href="https://tasogare.github.io/rss.xml"><link rel="stylesheet" href="/_astro/BaseLayout.BWr1z5HB.css"></head><body><div class="min-h-screen bg-surface text-on-surface transition-colors"><nav class="site-nav" data-astro-cid-yxete6jp><div class="nav-container" data-astro-cid-yxete6jp><div class="nav-inner" data-astro-cid-yxete6jp><div class="tabs" data-astro-cid-yxete6jp><a href="/" class="tab" data-astro-cid-yxete6jp><span data-astro-cid-yxete6jp>About</span></a><a href="/diary/" class="tab" data-astro-cid-yxete6jp><span data-astro-cid-yxete6jp>Diary</span></a><a href="/memo/" class="tab" data-astro-cid-yxete6jp><span data-astro-cid-yxete6jp>Memo</span></a></div><div class="theme-toggle-wrap" data-astro-cid-yxete6jp><button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" data-astro-cid-yxete6jp><svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" data-astro-cid-yxete6jp><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" data-astro-cid-yxete6jp></path></svg><svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" data-astro-cid-yxete6jp><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" data-astro-cid-yxete6jp></path></svg></button></div></div></div></nav><script type="module">document.getElementById(`theme-toggle`)?.addEventListener(`click`,()=>{let e=document.documentElement.classList.toggle(`dark`);localStorage.theme=e?`dark`:`light`});</script><div class="main-container"><main class="max-w-layout mx-auto"><div class="grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_600px_minmax(0,1fr)]"><aside class="hidden md:block" aria-label="Left sidebar"></aside><div class="w-full border-x border-outline-variant min-h-[calc(100vh-4rem)] bg-surface"><div class="p-4"><div class="space-y-6"><header class="pb-3 border-b border-outline-variant"><h1 class="text-headline-large font-bold text-primary mb-1">LGTM ジェネレータ</h1><p class="text-body-medium text-on-surface-variant">画像に「LGTM」を差し込みます。デコードから合成・PNG出力まで<span class="font-semibold">Rust製のWASM</span>がブラウザ内で処理するので、画像はどこにもアップロードされません。</p></header><!-- 画像入力(クリック / ドラッグ&ドロップ / ペースト) --><div id="drop" class="border-2 border-dashed border-outline-variant rounded-md p-6 text-center cursor-pointer hover:border-primary transition-colors"><p class="text-body-medium text-on-surface-variant">画像をドロップ / クリックして選択 / 貼り付け(⌘V)</p><input id="file" type="file" accept="image/*" class="hidden"></div><!-- 設定 --><div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><label class="block"><span class="text-body-small text-on-surface-variant">文言</span><input id="text" type="text" value="LGTM" class="mt-1 w-full rounded-md border border-outline-variant bg-surface text-on-surface px-3 py-2"></label><label class="block"><span class="text-body-small text-on-surface-variant">サブ文言(任意)</span><input id="subtext" type="text" placeholder="Looks Good To Me" class="mt-1 w-full rounded-md border border-outline-variant bg-surface text-on-surface px-3 py-2"></label><label class="block"><span class="text-body-small text-on-surface-variant">位置</span><select id="position" class="mt-1 w-full rounded-md border border-outline-variant bg-surface text-on-surface px-3 py-2"><option value="center" selected>中央</option><option value="top">上</option><option value="bottom">下</option></select></label><label class="block"><span class="text-body-small text-on-surface-variant">文字サイズ <span id="sizeval">18</span>%</span><input id="size" type="range" min="6" max="40" value="18" class="mt-3 w-full"></label><label class="flex items-center gap-2"><span class="text-body-small text-on-surface-variant">文字色</span><input id="fill" type="color" value="#ffffff" class="h-9 w-14"></label><label class="flex items-center gap-2"><span class="text-body-small text-on-surface-variant">縁取り色</span><input id="outline" type="color" value="#000000" class="h-9 w-14"></label></div><div id="status" class="text-body-small text-on-surface-variant"></div><!-- プレビュー --><div id="result" class="hidden space-y-3"><div class="rounded-md border border-outline-variant p-2 bg-secondary-container/10 flex justify-center"><img id="preview" alt="LGTM プレビュー" class="max-w-full h-auto"></div><div class="flex flex-wrap gap-3"><a id="download" class="inline-block rounded-md bg-primary text-on-primary px-4 py-2 text-body-medium font-semibold cursor-pointer" download="lgtm.png">ダウンロード</a><button id="copy" class="rounded-md border border-outline-variant px-4 py-2 text-body-medium cursor-pointer">クリップボードにコピー</button></div></div></div><script type="module">
    // public/ 配下の wasm グルーを動的import(Astroのバンドル対象外にする)
    const wasm = await import("/tool/lgtm/pkg/lgtm.js")
    await wasm.default()

    const $ = id => document.getElementById(id)
    const drop = $("drop"),
      file = $("file"),
      status = $("status"),
      result = $("result"),
      preview = $("preview"),
      download = $("download"),
      copyBtn = $("copy")

    let srcBytes = null // 元画像の Uint8Array
    let blobUrl = null // 生成PNGの Object URL

    $("size").addEventListener("input", () => {
      $("sizeval").textContent = $("size").value
    })

    function setStatus(msg, isError = false) {
      status.textContent = msg
      status.className = isError
        ? "text-body-small text-red-500"
        : "text-body-small text-on-surface-variant"
    }

    async function loadFile(f) {
      if (!f || !f.type.startsWith("image/")) {
        setStatus("画像ファイルを選んでください", true)
        return
      }
      srcBytes = new Uint8Array(await f.arrayBuffer())
      render()
    }

    function render() {
      if (!srcBytes) return
      setStatus("生成中…")
      try {
        const png = wasm.generate(
          srcBytes,
          $("text").value,
          $("subtext").value,
          $("position").value,
          $("fill").value,
          $("outline").value,
          Number($("size").value) / 100,
          1200,
        )
        if (blobUrl) URL.revokeObjectURL(blobUrl)
        blobUrl = URL.createObjectURL(new Blob([png], { type: "image/png" }))
        preview.src = blobUrl
        download.href = blobUrl
        result.classList.remove("hidden")
        setStatus("完成しました")
      } catch (e) {
        setStatus("生成に失敗しました: " + e, true)
      }
    }

    // 入力トリガ
    drop.addEventListener("click", () => file.click())
    file.addEventListener("change", () => loadFile(file.files[0]))
    ;["text", "subtext", "position", "size", "fill", "outline"].forEach(id =>
      $(id).addEventListener("input", render),
    )

    // ドラッグ&ドロップ
    drop.addEventListener("dragover", e => {
      e.preventDefault()
      drop.classList.add("border-primary")
    })
    drop.addEventListener("dragleave", () =>
      drop.classList.remove("border-primary"),
    )
    drop.addEventListener("drop", e => {
      e.preventDefault()
      drop.classList.remove("border-primary")
      loadFile(e.dataTransfer.files[0])
    })

    // クリップボードからの貼り付け
    window.addEventListener("paste", e => {
      const item = [...e.clipboardData.items].find(i =>
        i.type.startsWith("image/"),
      )
      if (item) loadFile(item.getAsFile())
    })

    // クリップボードへコピー
    copyBtn.addEventListener("click", async () => {
      if (!blobUrl) return
      try {
        const blob = await (await fetch(blobUrl)).blob()
        await navigator.clipboard.write([
          new ClipboardItem({ "image/png": blob }),
        ])
        setStatus("クリップボードにコピーしました")
      } catch (e) {
        setStatus("コピーに失敗しました: " + e, true)
      }
    })
  </script></div></div><aside class="hidden md:block" aria-label="Right sidebar"></aside></div></main></div></div></body></html>
